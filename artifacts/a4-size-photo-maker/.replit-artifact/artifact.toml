kind = "web"
previewPath = "/"
title = "A4 Size Photo Maker"
description = "A single-page browser tool that arranges uploaded photos on a print-ready A4 sheet with preset or custom dimensions and downloads the result as PNG or PDF."
version = "1.0.0"
id = "artifacts/a4-size-photo-maker"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20742

[services.development]
run = "pnpm --filter @workspace/a4-size-photo-maker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/a4-size-photo-maker", "run", "build" ]
serve = "static"
publicDir = "artifacts/a4-size-photo-maker/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20742"
BASE_PATH = "/"
