<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Passport photo sheet illustration</title>
  <desc id="desc">A measured A4 sheet with repeated passport photo rectangles.</desc>
  <defs>
    <linearGradient id="passport-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#304452"/>
      <stop offset="1" stop-color="#18262f"/>
    </linearGradient>
    <linearGradient id="portrait" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f2b398"/>
      <stop offset=".5" stop-color="#7cb5aa"/>
      <stop offset="1" stop-color="#385b69"/>
    </linearGradient>
  </defs>
  <rect width="900" height="540" rx="20" fill="url(#passport-bg)"/>
  <text x="54" y="62" fill="#f4b38f" font-family="monospace" font-size="18" letter-spacing="4">PASSPORT / A4 · 35 × 45 MM</text>
  <rect x="252" y="54" width="350" height="438" rx="4" fill="#fbfaf5"/>
  <rect x="274" y="76" width="306" height="394" fill="none" stroke="#bec8c5" stroke-dasharray="5 7"/>
  <g fill="url(#portrait)" stroke="#198b82" stroke-width="3">
    <rect x="294" y="102" width="78" height="100" rx="2"/><rect x="388" y="102" width="78" height="100" rx="2"/><rect x="482" y="102" width="78" height="100" rx="2"/>
    <rect x="294" y="224" width="78" height="100" rx="2"/><rect x="388" y="224" width="78" height="100" rx="2"/><rect x="482" y="224" width="78" height="100" rx="2"/>
    <rect x="294" y="346" width="78" height="100" rx="2"/><rect x="388" y="346" width="78" height="100" rx="2"/><rect x="482" y="346" width="78" height="100" rx="2"/>
  </g>
  <text x="660" y="258" fill="#f8faf7" font-family="sans-serif" font-size="25" font-weight="700">Print-ready</text>
  <text x="660" y="296" fill="#b6d2ce" font-family="monospace" font-size="18">A4 portrait</text>
  <circle cx="672" cy="356" r="7" fill="#f4b38f"/>
  <text x="694" y="364" fill="#b6d2ce" font-family="monospace" font-size="16">100% scale</text>
</svg>