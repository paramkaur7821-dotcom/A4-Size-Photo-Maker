<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Voter ID photo sheet illustration</title>
  <desc id="desc">Voter ID photo spaces arranged on a measured A4 sheet.</desc>
  <defs>
    <linearGradient id="voter-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#554b45"/>
      <stop offset="1" stop-color="#29383e"/>
    </linearGradient>
    <linearGradient id="voter-photo" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e7b899"/>
      <stop offset=".5" stop-color="#8bb6ad"/>
      <stop offset="1" stop-color="#47636d"/>
    </linearGradient>
  </defs>
  <rect width="900" height="540" rx="20" fill="url(#voter-bg)"/>
  <text x="54" y="62" fill="#f4b38f" font-family="monospace" font-size="18" letter-spacing="4">VOTER ID / A4 PHOTO SHEET</text>
  <rect x="252" y="54" width="350" height="438" rx="4" fill="#fbfaf5"/>
  <rect x="274" y="76" width="306" height="394" fill="none" stroke="#bec8c5" stroke-dasharray="5 7"/>
  <g fill="url(#voter-photo)" stroke="#198b82" stroke-width="3">
    <rect x="294" y="102" width="78" height="100" rx="2"/><rect x="388" y="102" width="78" height="100" rx="2"/><rect x="482" y="102" width="78" height="100" rx="2"/>
    <rect x="294" y="224" width="78" height="100" rx="2"/><rect x="388" y="224" width="78" height="100" rx="2"/><rect x="482" y="224" width="78" height="100" rx="2"/>
    <rect x="294" y="346" width="78" height="100" rx="2"/><rect x="388" y="346" width="78" height="100" rx="2"/><rect x="482" y="346" width="78" height="100" rx="2"/>
  </g>
  <text x="660" y="258" fill="#f8faf7" font-family="sans-serif" font-size="25" font-weight="700">Cut with confidence</text>
  <text x="660" y="296" fill="#b6d2ce" font-family="monospace" font-size="18">clear spacing</text>
  <circle cx="672" cy="356" r="7" fill="#f4b38f"/>
  <text x="694" y="364" fill="#b6d2ce" font-family="monospace" font-size="16">print at 100%</text>
</svg>