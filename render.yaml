services:
  - type: web
    name: a4-size-photo-maker
    runtime: static
    buildCommand: echo ready
    staticPublishPath: render-static
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: PORT
        value: "20742"
      - key: BASE_PATH
        value: /