services:
  - type: web
    name: a4-size-photo-maker
    runtime: static
    buildCommand: pnpm --filter @workspace/a4-size-photo-maker run build
    staticPublishPath: artifacts/a4-size-photo-maker/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: PORT
        value: "20742"
      - key: BASE_PATH
        value: /